# tmux.conf — Karthik Kondamudi

# -----------------------------------------------------------------------------
# Prefix: Ctrl-a (easier than Ctrl-b)
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # true color
set -g history-limit 50000
set -g mouse on
set -g base-index 1          # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0         # no delay after Escape
set -g focus-events on

# -----------------------------------------------------------------------------
# Key bindings
# -----------------------------------------------------------------------------
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes (intuitive keys)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New window in same directory
bind c new-window -c "#{pane_current_path}"

# Copy mode with vi keys
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send -X rectangle-toggle

# -----------------------------------------------------------------------------
# Status bar
# -----------------------------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#282a36,fg=#f8f8f2"

set -g status-left  "#[bold,fg=#50fa7b] #S  "
set -g status-right "#[fg=#6272a4]%a %d %b  #[fg=#f8f8f2]%H:%M "
set -g status-right-length 40
set -g status-left-length 30

setw -g window-status-current-style "bold,fg=#ff79c6"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Pane borders
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"
